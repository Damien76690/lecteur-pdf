<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecteur PDF libre</title>
<style>
  :root { --bg:#f3f4f6; --panel:#fff; --text:#1f2937; --muted:#6b7280; --accent:#2563eb; --border:#d1d5db; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { position:sticky; top:0; z-index:10; background:var(--panel); border-bottom:1px solid var(--border);
           padding:8px 12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  .group { display:flex; gap:4px; align-items:center; padding-right:10px; border-right:1px solid var(--border); }
  .group:last-child { border-right:none; }
  button, label.btn { font:inherit; padding:6px 10px; border:1px solid var(--border); border-radius:6px;
           background:#fff; cursor:pointer; white-space:nowrap; }
  button:hover, label.btn:hover { border-color:var(--accent); }
  button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  input[type=text] { font:inherit; padding:6px; border:1px solid var(--border); border-radius:6px; width:120px; }
  input[type=number] { width:52px; padding:5px; border:1px solid var(--border); border-radius:6px; }
  #msg { padding:8px 12px; color:var(--muted); min-height:34px; }
  #msg.err { color:#b91c1c; }
  #pages { display:flex; flex-direction:column; align-items:center; gap:18px; padding:8px 12px 60px; }
  .page { position:relative; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.2); max-width:100%; }
  .page img { display:block; width:100%; user-select:none; -webkit-user-drag:none; }
  .page .bar { position:absolute; top:-1px; right:-1px; display:flex; gap:2px; opacity:.85; }
  .page .bar button { padding:2px 6px; font-size:12px; }
  .page .num { position:absolute; bottom:-18px; left:0; right:0; text-align:center; color:var(--muted); font-size:12px; }
  .sel { position:absolute; border:2px dashed #dc2626; background:rgba(220,38,38,.1); pointer-events:none; }
  .mode-text .page img { cursor:text; } .mode-erase .page img { cursor:crosshair; }
  #drop { margin:60px auto; max-width:520px; padding:40px; border:2px dashed var(--border); border-radius:12px;
          text-align:center; color:var(--muted); background:var(--panel); }
  #drop.over { border-color:var(--accent); }
  .busy { cursor:progress !important; }
</style>
</head>
<body>
<header>
  <h1>📄 Lecteur PDF</h1>
  <div class="group">
    <label class="btn">Ouvrir un PDF<input id="file" type="file" accept="application/pdf" hidden></label>
  </div>
  <div class="group">
    <button data-mode="read" class="on">Lecture</button>
    <button data-mode="text" title="Cliquez sur la page à l'endroit où écrire">Écrire</button>
    <input id="size" type="number" value="12" min="4" max="96" title="Taille du texte">
    <input id="color" type="color" value="#000000" title="Couleur du texte">
    <button data-mode="erase" title="Tracez un rectangle pour effacer une zone">Effacer une zone</button>
  </div>
  <div class="group">
    <input id="old" type="text" placeholder="Rechercher…">
    <input id="new" type="text" placeholder="Remplacer par…">
    <button id="replace">Remplacer</button>
  </div>
  <div class="group">
    <button id="undo">↶ Annuler</button>
    <button id="ocr" title="Reconnaître le texte d'un PDF scanné ou d'une image">Reconnaître le texte (OCR)</button>
  </div>
  <div class="group">
    Enregistrer :
    <button data-dl="pdf">PDF</button>
    <button data-dl="docx">Word</button>
    <button data-dl="xlsx">Excel</button>
    <button data-dl="txt">Texte</button>
  </div>
</header>
<div id="msg">Ouvrez un PDF pour commencer.</div>
<div id="drop">Glissez un fichier PDF ici<br>ou utilisez « Ouvrir un PDF ».</div>
<div id="pages"></div>

<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
let doc = null, mode = "read";

function say(text, err) { const m = $("#msg"); m.textContent = text; m.className = err ? "err" : ""; }
function busy(on) { document.body.classList.toggle("busy", on); $$("header button").forEach(b => b.disabled = on); }
function setButtons() { $$("header button").forEach(b => b.disabled = !doc); }

async function call(url, opts, waitMsg) {
  busy(true); if (waitMsg) say(waitMsg);
  try {
    const r = await fetch(url, opts);
    const j = await r.json();
    if (!r.ok) { say(j.error || "Erreur.", true); return null; }
    return j;
  } catch (e) { say("Erreur : " + e, true); return null; }
  finally { busy(false); setButtons(); }
}

async function openFile(f) {
  if (!f) return;
  const fd = new FormData(); fd.append("file", f);
  const j = await call("/api/open", {method:"POST", body:fd}, "Ouverture…");
  if (!j) return;
  doc = j; $("#drop")?.remove(); setButtons(); render();
  say(`${j.name} : ${j.pages.length} page(s).` + (j.needs_ocr
      ? " Ce PDF semble être une image (scan) : cliquez sur « Reconnaître le texte (OCR) » pour pouvoir le modifier ou le convertir." : ""));
}

function render() {
  const box = $("#pages"); box.innerHTML = "";
  doc.pages.forEach((p, i) => {
    const div = document.createElement("div");
    div.className = "page"; div.style.width = Math.round(p.w * 1.5) + "px";
    div.innerHTML = `<img src="/api/${doc.id}/page/${i}.png?v=${doc.version}&zoom=2" draggable="false" alt="Page ${i+1}">
      <div class="bar"><button title="Pivoter">⟳</button><button title="Supprimer la page">🗑</button></div>
      <div class="num">${i + 1} / ${doc.pages.length}</div>`;
    const [rot, del] = div.querySelectorAll(".bar button");
    rot.onclick = () => edit({action:"rotate", page:i});
    del.onclick = () => confirm(`Supprimer la page ${i+1} ?`) && edit({action:"delete_page", page:i});
    attachTools(div, i, p);
    box.appendChild(div);
  });
}

// Coordonnées écran -> points PDF.
function toPdf(img, p, e) {
  const r = img.getBoundingClientRect();
  return { x: (e.clientX - r.left) * p.w / r.width, y: (e.clientY - r.top) * p.h / r.height };
}

function attachTools(div, i, p) {
  const img = div.querySelector("img");
  img.addEventListener("click", e => {
    if (mode !== "text") return;
    const pt = toPdf(img, p, e);
    const text = prompt("Texte à écrire (plusieurs lignes : utilisez \\n) :");
    if (text) edit({action:"add_text", page:i, x:pt.x, y:pt.y, text:text.replace(/\\n/g, "\n"),
                    size:$("#size").value, color:$("#color").value});
  });
  let start = null, sel = null;
  img.addEventListener("mousedown", e => {
    if (mode !== "erase") return;
    e.preventDefault(); start = {e, pt: toPdf(img, p, e)};
    sel = document.createElement("div"); sel.className = "sel"; div.appendChild(sel);
  });
  window.addEventListener("mousemove", e => {
    if (!start) return;
    const r = img.getBoundingClientRect();
    const x0 = Math.min(start.e.clientX, e.clientX) - r.left, y0 = Math.min(start.e.clientY, e.clientY) - r.top;
    Object.assign(sel.style, {left:x0+"px", top:y0+"px",
      width:Math.abs(e.clientX - start.e.clientX)+"px", height:Math.abs(e.clientY - start.e.clientY)+"px"});
  });
  window.addEventListener("mouseup", e => {
    if (!start) return;
    const a = start.pt, b = toPdf(img, p, e); start = null; sel.remove();
    if (Math.abs(a.x - b.x) < 3 || Math.abs(a.y - b.y) < 3) return;
    edit({action:"whiteout", page:i, x0:Math.min(a.x,b.x), y0:Math.min(a.y,b.y), x1:Math.max(a.x,b.x), y1:Math.max(a.y,b.y)});
  });
}

async function edit(body) {
  const j = await call(`/api/${doc.id}/edit`, {method:"POST", headers:{"Content-Type":"application/json"},
                       body:JSON.stringify(body)}, "Modification…");
  if (j) { doc = j; render(); say(j.message); }
}

$$("[data-mode]").forEach(b => b.onclick = () => {
  mode = b.dataset.mode;
  $$("[data-mode]").forEach(x => x.classList.toggle("on", x === b));
  document.body.className = "mode-" + mode;
  say({read:"Mode lecture.", text:"Cliquez sur la page à l'endroit où écrire.",
       erase:"Tracez un rectangle sur la zone à effacer."}[mode]);
});
$("#replace").onclick = () => edit({action:"replace", old:$("#old").value, new:$("#new").value});
$("#undo").onclick = () => edit({action:"undo"});
$("#ocr").onclick = async () => {
  const j = await call(`/api/${doc.id}/ocr`, {method:"POST"}, "Reconnaissance du texte en cours (peut prendre un moment par page)…");
  if (j) { doc = j; render(); say(j.message); }
};
$$("[data-dl]").forEach(b => b.onclick = async () => {
  if (window.pywebview?.api) {  // application Windows : fenêtre « Enregistrer sous »
    busy(true); say(b.dataset.dl === "pdf" ? "Enregistrement…" : "Conversion en cours…");
    try { say((await pywebview.api.enregistrer(doc.id, b.dataset.dl)).message); }
    catch (e) { say("Erreur : " + (e.message || e), true); }
    finally { busy(false); setButtons(); }
    return;
  }
  say(b.dataset.dl === "pdf" ? "Téléchargement…" : "Conversion en cours, le téléchargement va démarrer…");
  location.href = `/api/${doc.id}/download/${b.dataset.dl}`;
});
$("#file").onchange = e => openFile(e.target.files[0]);
const drop = $("#drop");
["dragover","dragenter"].forEach(t => document.addEventListener(t, e => { e.preventDefault(); drop?.classList.add("over"); }));
document.addEventListener("dragleave", () => drop?.classList.remove("over"));
document.addEventListener("drop", e => { e.preventDefault(); openFile(e.dataTransfer.files[0]); });
setButtons();
</script>
</body>
</html>
