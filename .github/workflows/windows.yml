# Compile l'application Windows (installateur + version portable).
# À chaque modification de « main », une nouvelle version est publiée dans « Releases ».
name: Application Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les composants Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-bureau.txt pyinstaller pytest

      - name: Installer Tesseract (OCR) avec le français
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $src = "C:\Program Files\Tesseract-OCR"
          Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata/raw/main/fra.traineddata" -OutFile "$src\tessdata\fra.traineddata"
          $dst = "build\tesseract"
          New-Item -ItemType Directory -Force "$dst\tessdata" | Out-Null
          Copy-Item "$src\tesseract.exe", "$src\*.dll" $dst
          Copy-Item "$src\tessdata\configs", "$src\tessdata\pdf.ttf" "$dst\tessdata" -Recurse
          Copy-Item "$src\tessdata\eng.traineddata", "$src\tessdata\fra.traineddata", "$src\tessdata\osd.traineddata" "$dst\tessdata"
          Get-ChildItem $dst -Recurse | Measure-Object Length -Sum | ForEach-Object { "Tesseract embarqué : {0:N0} Mo" -f ($_.Sum / 1MB) }
          "$src" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Tests
        run: python -m pytest -q tests

      - name: Compiler LecteurPDF.exe
        run: pyinstaller --noconfirm --distpath dist --workpath build\pyinstaller windows\lecteur-pdf.spec

      - name: Vérifier l'application compilée (OCR, Word, Excel)
        shell: pwsh
        run: |
          $env:PATH = "C:\Windows\System32;C:\Windows"   # Tesseract système invisible : on teste celui embarqué
          $p = Start-Process "dist\LecteurPDF\LecteurPDF.exe" -ArgumentList "--verifier" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\LecteurPDF\journal.txt" -ErrorAction SilentlyContinue | Select-Object -Last 30
          if ($p.ExitCode -ne 0) { throw "La vérification a échoué (code $($p.ExitCode))" }
          $p = Start-Process "dist\LecteurPDF\LecteurPDF.exe" -ArgumentList "--essai-fenetre" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\LecteurPDF\journal.txt" -ErrorAction SilentlyContinue | Select-Object -Last 30
          if ($p.ExitCode -ne 0) { throw "La fenêtre ne s'est pas ouverte (code $($p.ExitCode))" }

      - name: Fabriquer l'installateur
        shell: pwsh
        run: |
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "build\MicrosoftEdgeWebview2Setup.exe"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=1.0.${{ github.run_number }}" windows\installateur.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup a échoué" }
          Compress-Archive dist\LecteurPDF dist\LecteurPDF-portable.zip
          Get-ChildItem dist\*.exe, dist\*.zip | Format-Table Name, @{n="Mo";e={[math]::Round($_.Length / 1MB, 1)}}

      - uses: actions/upload-artifact@v4
        with:
          name: LecteurPDF-windows
          path: |
            dist/LecteurPDF-installation.exe
            dist/LecteurPDF-portable.zip

      - name: Publier la version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Lecteur PDF libre 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            **Installer :** téléchargez `LecteurPDF-installation.exe`, double-cliquez dessus et suivez les étapes (aucun droit administrateur nécessaire). L'application apparaît ensuite dans le menu Démarrer et sur le Bureau.

            **Sans installation :** `LecteurPDF-portable.zip`, à décompresser, puis double-clic sur `LecteurPDF.exe`.

            La reconnaissance de texte (OCR, français et anglais) est incluse.
          files: |
            dist/LecteurPDF-installation.exe
            dist/LecteurPDF-portable.zip
