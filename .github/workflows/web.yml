name: Version en ligne
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Traduction en français avec les vrais modèles libres (téléchargés depuis Hugging Face).
  traduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save @huggingface/transformers@4.3.1
      - run: node scripts/sonde-traduction.mjs
      - run: node scripts/essai-traduction.mjs

  # Outil en ligne de commande Python (pdftools.py), facultatif.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-fra
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
